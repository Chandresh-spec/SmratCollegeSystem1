<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — EduHub | Create Your Account</title>
    <meta name="description" content="Create your EduHub account. Join the Smart College Management System for students and faculty.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family:'Inter',sans-serif;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            background: #0a0a1a;
            color:#fff;
            overflow-x: hidden;
            position: relative;
        }

        /* ── Animated Mesh Gradient Background ── */
        .mesh-bg {
            position: fixed;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            z-index: 0;
            background:
                radial-gradient(ellipse at 30% 20%, rgba(6, 182, 212, 0.25) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(168, 85, 247, 0.25) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 30%, rgba(236, 72, 153, 0.18) 0%, transparent 50%),
                radial-gradient(ellipse at 20% 70%, rgba(59, 130, 246, 0.15) 0%, transparent 50%);
            animation: meshMove 18s ease-in-out infinite alternate;
        }
        @keyframes meshMove {
            0%   { transform: translate(0, 0) rotate(0deg); }
            33%  { transform: translate(20px, -30px) rotate(2deg); }
            66%  { transform: translate(-25px, 15px) rotate(-3deg); }
            100% { transform: translate(10px, -20px) rotate(1deg); }
        }

        /* ── Floating Orbs ── */
        .orbs {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(1px);
            animation: orbFloat linear infinite;
        }
        @keyframes orbFloat {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        /* ── Container ── */
        .register-container {
            width: 100%; max-width: 520px;
            padding: 20px;
            z-index: 10;
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ── Glass Card ── */
        .register-card {
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(40px) saturate(150%);
            -webkit-backdrop-filter: blur(40px) saturate(150%);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px;
            padding: 40px 36px;
            box-shadow:
                0 25px 70px rgba(0,0,0,0.4),
                0 0 0 1px rgba(255,255,255,0.05) inset,
                0 1px 0 rgba(255,255,255,0.1) inset;
            position: relative;
            overflow: hidden;
        }
        .register-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, #06b6d4, #a855f7, #ec4899, #06b6d4);
            background-size: 300% 100%;
            animation: shimmer 4s ease infinite;
        }
        @keyframes shimmer {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ── Logo ── */
        .logo { text-align: center; margin-bottom: 32px; }
        .logo-icon {
            width: 64px; height: 64px;
            border-radius: 18px;
            background: linear-gradient(135deg, #06b6d4, #a855f7);
            display: flex; align-items: center; justify-content: center;
            font-size: 32px;
            margin: 0 auto 16px;
            box-shadow: 0 8px 32px rgba(6, 182, 212, 0.3);
            animation: pulse-glow 3s ease-in-out infinite;
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 8px 32px rgba(6, 182, 212, 0.3); }
            50% { box-shadow: 0 8px 48px rgba(6, 182, 212, 0.5), 0 0 20px rgba(168, 85, 247, 0.2); }
        }
        .logo h1 {
            font-size: 30px; font-weight: 800;
            background: linear-gradient(135deg, #22d3ee, #c084fc, #f9a8d4);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }
        .logo p {
            color: rgba(255,255,255,0.45);
            font-size: 13px; margin-top: 6px;
            font-weight: 400; letter-spacing: 0.5px;
        }

        /* ── Step Progress ── */
        .progress-bar {
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 32px; gap: 6px;
        }
        .prog-step {
            display: flex; align-items: center; gap: 6px;
        }
        .prog-circle {
            width: 32px; height: 32px; border-radius: 50%;
            background: rgba(255,255,255,0.08);
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 700;
            transition: all 0.4s;
            border: 2px solid transparent;
        }
        .prog-circle.active {
            background: linear-gradient(135deg, #06b6d4, #a855f7);
            box-shadow: 0 0 16px rgba(6, 182, 212, 0.4);
            border-color: transparent;
        }
        .prog-circle.done {
            background: #22c55e;
            border-color: transparent;
        }
        .prog-label {
            font-size: 11px; font-weight: 600;
            color: rgba(255,255,255,0.35);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: color 0.3s;
        }
        .prog-label.active { color: rgba(255,255,255,0.8); }
        .prog-line {
            width: 40px; height: 2px;
            background: rgba(255,255,255,0.08);
            margin: 0 4px;
            transition: background 0.4s;
        }
        .prog-line.done { background: #22c55e; }

        /* ── Forms ── */
        .form-row { display: flex; gap: 14px; }
        .form-row .form-group { flex: 1; }

        .form-group { margin-bottom: 18px; position: relative; }
        .form-group label {
            display: block; font-size: 12px; font-weight: 600;
            color: rgba(255,255,255,0.6);
            margin-bottom: 7px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .form-group input, .form-group select {
            width: 100%; padding: 13px 15px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px; color: #fff; font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: rgba(6, 182, 212, 0.6);
            background: rgba(255,255,255,0.08);
            box-shadow: 0 0 0 4px rgba(6, 182, 212, 0.1), 0 0 20px rgba(6, 182, 212, 0.05);
        }
        .form-group input::placeholder { color: rgba(255,255,255,0.25); }
        .form-group select { cursor: pointer; appearance: none; }
        .form-group select option { background: #1a1a2e; color: #fff; }

        /* Select wrapper with arrow */
        .select-wrapper { position: relative; }
        .select-wrapper::after {
            content: '▾'; position: absolute;
            right: 14px; top: 50%; transform: translateY(-50%);
            color: rgba(255,255,255,0.4); pointer-events: none;
            font-size: 14px;
        }

        /* ── Password strength ── */
        .password-strength { margin-top: 8px; }
        .strength-bar {
            height: 4px; border-radius: 2px;
            background: rgba(255,255,255,0.08);
            overflow: hidden;
        }
        .strength-fill {
            height: 100%; border-radius: 2px;
            transition: width 0.4s, background 0.4s;
            width: 0%;
        }
        .strength-text {
            font-size: 11px; margin-top: 4px;
            font-weight: 500; letter-spacing: 0.5px;
        }

        /* ── Buttons ── */
        .btn-register {
            width: 100%; padding: 15px;
            background: linear-gradient(135deg, #06b6d4, #8b5cf6);
            border: none; border-radius: 14px;
            color: #fff; font-size: 16px; font-weight: 700;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 8px;
            position: relative; overflow: hidden;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.3px;
        }
        .btn-register::before {
            content: '';
            position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transition: left 0.5s;
        }
        .btn-register:hover::before { left: 100%; }
        .btn-register:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(6, 182, 212, 0.4);
        }
        .btn-register:active { transform: translateY(-1px); }
        .btn-register:disabled {
            opacity: 0.5; cursor: not-allowed; transform: none !important;
            box-shadow: none !important;
        }

        .btn-outline {
            width: 100%; padding: 15px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 14px;
            color: rgba(255,255,255,0.7); font-size: 15px; font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
            margin-top: 10px;
        }
        .btn-outline:hover {
            background: rgba(255,255,255,0.06);
            border-color: rgba(255,255,255,0.25);
            color: #fff;
        }

        /* ── Messages ── */
        .error-msg, .success-msg {
            padding: 12px 16px; border-radius: 12px;
            font-size: 13px; margin-bottom: 18px; display: none;
            animation: msgSlide 0.3s ease;
        }
        @keyframes msgSlide {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .error-msg {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #fca5a5;
        }
        .success-msg {
            background: rgba(34, 197, 94, 0.12);
            border: 1px solid rgba(34, 197, 94, 0.25);
            color: #86efac;
        }

        /* ── OTP ── */
        .otp-container {
            display: flex; gap: 10px; justify-content: center; margin-bottom: 24px;
        }
        .otp-input {
            width: 50px; height: 56px;
            text-align: center; font-size: 22px; font-weight: 700;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px; color: #fff;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s;
        }
        .otp-input:focus {
            outline: none;
            border-color: rgba(6, 182, 212, 0.6);
            box-shadow: 0 0 0 4px rgba(6, 182, 212, 0.1);
            background: rgba(255,255,255,0.1);
        }

        .resend-timer {
            text-align: center; margin-top: 16px;
            font-size: 13px; color: rgba(255,255,255,0.4);
        }
        .resend-btn {
            background: none; border: none; color: #22d3ee;
            cursor: pointer; font-weight: 600;
            font-family: 'Inter', sans-serif; font-size: 13px;
        }
        .resend-btn:disabled { color: rgba(255,255,255,0.3); cursor: not-allowed; }

        /* ── Login Link ── */
        .login-link {
            text-align: center; margin-top: 24px;
            font-size: 14px; color: rgba(255,255,255,0.45);
        }
        .login-link a {
            color: #22d3ee; text-decoration: none; font-weight: 600;
            transition: color 0.3s;
        }
        .login-link a:hover { color: #67e8f9; text-decoration: underline; }

        /* ── Checkbox ── */
        .checkbox-group {
            display: flex; align-items: center; gap: 10px;
            margin-bottom: 18px;
        }
        .checkbox-group input[type="checkbox"] {
            width: 18px; height: 18px;
            accent-color: #06b6d4;
            cursor: pointer;
        }
        .checkbox-group label {
            font-size: 13px; color: rgba(255,255,255,0.55);
            cursor: pointer; text-transform: none; letter-spacing: 0;
            font-weight: 400;
        }

        /* ── Hidden ── */
        .hidden { display: none !important; }

        .sem-field { display: none; }

        /* ── Section title in form ── */
        .section-title {
            font-size: 14px; font-weight: 600;
            color: rgba(255,255,255,0.5);
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ── Responsive ── */
        @media (max-width: 520px) {
            .register-card { padding: 32px 24px; border-radius: 20px; }
            .logo h1 { font-size: 26px; }
            .form-row { flex-direction: column; gap: 0; }
            .otp-input { width: 42px; height: 48px; font-size: 18px; }
            .prog-label { display: none; }
        }
    </style>
</head>
<body>
    <!-- Mesh Gradient Background -->
    <div class="mesh-bg"></div>

    <!-- Floating Orbs -->
    <div class="orbs" id="orbs"></div>

    <!-- Main Register Form -->
    <div class="register-container">
        <div class="register-card">
            <div class="logo">
                <div class="logo-icon">🎓</div>
                <h1>EduHub</h1>
                <p>Create your account</p>
            </div>

            <!-- Step Progress Bar -->
            <div class="progress-bar">
                <div class="prog-step">
                    <div class="prog-circle active" id="pc1">1</div>
                    <span class="prog-label active" id="pl1">Details</span>
                </div>
                <div class="prog-line" id="pline1"></div>
                <div class="prog-step" style="margin-left:6px;">
                    <div class="prog-circle" id="pc2">✓</div>
                    <span class="prog-label" id="pl2">Done</span>
                </div>
            </div>

            <div class="error-msg" id="errorMsg"></div>
            <div class="success-msg" id="successMsg"></div>

            <!-- ═══════ STEP 1: Account Details ═══════ -->
            <div id="step1">
                <div class="section-title">Account Information</div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" id="username" placeholder="Choose a username" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="email" placeholder="you@example.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Minimum 6 characters" required>
                    <div class="password-strength">
                        <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
                        <div class="strength-text" id="strengthText"></div>
                    </div>
                </div>

                <div class="section-title" style="margin-top:8px;">Profile Details</div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Role</label>
                        <div class="select-wrapper">
                            <select id="role">
                                <option value="student">Student</option>
                                <option value="faculty">Faculty</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Mobile</label>
                        <input type="text" id="mobile" placeholder="Phone number">
                    </div>
                </div>

                <div class="form-row sem-field" id="studentFields">
                    <div class="form-group">
                        <label>USN</label>
                        <input type="text" id="usn" placeholder="University Seat Number">
                    </div>
                    <div class="form-group">
                        <label>Semester</label>
                        <div class="select-wrapper">
                            <select id="sem">
                                <option value="1">Semester 1</option>
                                <option value="2">Semester 2</option>
                                <option value="3">Semester 3</option>
                                <option value="4">Semester 4</option>
                                <option value="5">Semester 5</option>
                                <option value="6">Semester 6</option>
                                <option value="7">Semester 7</option>
                                <option value="8">Semester 8</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="agreeTerms">
                    <label for="agreeTerms">I agree to the Terms of Service and Privacy Policy</label>
                </div>

                <button type="button" class="btn-register" id="step1Btn">Create Account</button>
            </div>



            <!-- ═══════ STEP 3: Success ═══════ -->
            <div id="step3" class="hidden">
                <div style="text-align:center; padding:20px 0;">
                    <div style="font-size:64px; margin-bottom:16px;">🎉</div>
                    <h2 style="font-size:24px; font-weight:800; margin-bottom:12px;
                        background:linear-gradient(135deg,#22d3ee,#c084fc);
                        -webkit-background-clip:text; -webkit-text-fill-color:transparent;">
                        Account Created!
                    </h2>
                    <p style="color:rgba(255,255,255,0.5); font-size:14px; margin-bottom:32px; line-height:1.6;">
                        Your account is ready.<br>
                        You can now sign in to access EduHub.
                    </p>
                    <a href="login.html" class="btn-register" style="display:inline-block; text-decoration:none; text-align:center;">
                        Go to Sign In →
                    </a>
                </div>
            </div>

            <div class="login-link" id="loginLinkDiv">
                Already have an account? <a href="login.html">Sign In</a>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        // ── Floating Orbs Generator ──
        (function createOrbs() {
            const container = document.getElementById('orbs');
            const colors = [
                'rgba(6, 182, 212, 0.15)',
                'rgba(168, 85, 247, 0.12)',
                'rgba(236, 72, 153, 0.1)',
                'rgba(59, 130, 246, 0.1)',
                'rgba(34, 197, 94, 0.08)',
            ];
            for (let i = 0; i < 25; i++) {
                const orb = document.createElement('div');
                orb.className = 'orb';
                const size = Math.random() * 8 + 3;
                orb.style.width = size + 'px';
                orb.style.height = size + 'px';
                orb.style.left = Math.random() * 100 + '%';
                orb.style.background = colors[Math.floor(Math.random() * colors.length)];
                orb.style.animationDuration = (Math.random() * 18 + 12) + 's';
                orb.style.animationDelay = (Math.random() * 12) + 's';
                container.appendChild(orb);
            }
        })();

        // ── State ──
        let registrationData = {};

        const step1Div = document.getElementById('step1');
        const step3Div = document.getElementById('step3');

        // Progress bar elements
        const pc = [document.getElementById('pc1'), document.getElementById('pc2')];
        const pl = [document.getElementById('pl1'), document.getElementById('pl2')];
        const plines = [document.getElementById('pline1')];

        function setRegStep(n) {
            [step1Div, step3Div].forEach((s, i) => s.classList.toggle('hidden', i !== n));
            // Hide login link on success step
            document.getElementById('loginLinkDiv').classList.toggle('hidden', n === 1);

            pc.forEach((c, i) => {
                c.classList.remove('active', 'done');
                if (i < n) { c.classList.add('done'); c.textContent = '✓'; }
                if (i === n) c.classList.add('active');
            });
            pl.forEach((l, i) => {
                l.classList.toggle('active', i === n);
            });
            plines.forEach((line, i) => {
                line.classList.toggle('done', i < n);
            });
        }

        // ── Toggle student fields ──
        document.getElementById('role').addEventListener('change', (e) => {
            document.getElementById('studentFields').style.display =
                e.target.value === 'student' ? 'flex' : 'none';
        });
        document.getElementById('studentFields').style.display = 'flex';

        // ── Password strength meter ──
        document.getElementById('password').addEventListener('input', (e) => {
            const val = e.target.value;
            const fill = document.getElementById('strengthFill');
            const text = document.getElementById('strengthText');
            let score = 0;
            if (val.length >= 6) score++;
            if (val.length >= 10) score++;
            if (/[A-Z]/.test(val)) score++;
            if (/[0-9]/.test(val)) score++;
            if (/[^A-Za-z0-9]/.test(val)) score++;

            const levels = [
                { w: '0%', c: '#555', t: '' },
                { w: '20%', c: '#ef4444', t: 'Weak' },
                { w: '40%', c: '#f97316', t: 'Fair' },
                { w: '60%', c: '#eab308', t: 'Good' },
                { w: '80%', c: '#22c55e', t: 'Strong' },
                { w: '100%', c: '#06b6d4', t: 'Excellent' },
            ];
            const lvl = levels[score];
            fill.style.width = lvl.w;
            fill.style.background = lvl.c;
            text.textContent = lvl.t;
            text.style.color = lvl.c;
        });

        // ══════════════════════════════════════
        // Collect data + Register
        // ══════════════════════════════════════
        document.getElementById('step1Btn').addEventListener('click', async () => {
            const btn = document.getElementById('step1Btn');
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';

            // Validate
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;
            const agree = document.getElementById('agreeTerms').checked;

            if (!username || !email || !password) {
                errorMsg.textContent = 'Please fill in all required fields.';
                errorMsg.style.display = 'block';
                return;
            }
            if (password.length < 6) {
                errorMsg.textContent = 'Password must be at least 6 characters.';
                errorMsg.style.display = 'block';
                return;
            }
            if (!agree) {
                errorMsg.textContent = 'Please agree to the Terms of Service.';
                errorMsg.style.display = 'block';
                return;
            }

            // Save data
            registrationData = {
                username,
                email,
                password,
                role,
                mobile_number: document.getElementById('mobile').value || null,
            };
            if (role === 'student') {
                registrationData.usn = document.getElementById('usn').value || null;
                registrationData.sem = parseInt(document.getElementById('sem').value) || null;
            }

            btn.disabled = true;
            btn.textContent = 'Creating account...';

            try {
                // Register directly
                const res = await fetch(`${API_BASE}/api/register/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(registrationData)
                });
                
                const data = await res.json();
                
                if (!res.ok) {
                    const errMsg = typeof data === 'object' && !data.error
                        ? Object.values(data).flat().join(', ')
                        : data.error || 'Registration failed';
                    throw new Error(errMsg);
                }

                setRegStep(1); // Go straight to success step
            } catch (err) {
                errorMsg.textContent = err.message;
                errorMsg.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Create Account';
            }
        });
    </script>
</body>
</html>
