<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — EduHub | Smart College Management</title>
    <meta name="description" content="Sign in to EduHub Smart College Management System. Access your courses, grades, and campus resources.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family:'Inter',sans-serif;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            background: #0a0a1a;
            color:#fff;
            overflow: hidden;
            position: relative;
        }

        /* ── Animated Aurora Background ── */
        .aurora {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            z-index: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(120, 80, 255, 0.25) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(0, 210, 255, 0.2) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(255, 0, 150, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 60%, rgba(50, 255, 180, 0.1) 0%, transparent 50%);
            animation: auroraMove 15s ease-in-out infinite alternate;
        }
        @keyframes auroraMove {
            0%   { transform: translate(0, 0) rotate(0deg); }
            33%  { transform: translate(-30px, 20px) rotate(3deg); }
            66%  { transform: translate(20px, -15px) rotate(-2deg); }
            100% { transform: translate(-10px, 30px) rotate(1deg); }
        }

        /* ── Floating Particles ── */
        .particles {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.06);
            animation: float linear infinite;
        }
        @keyframes float {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* ── Main Container ── */
        .login-container {
            width: 100%;
            max-width: 440px;
            padding: 20px;
            z-index: 10;
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ── Glass Card ── */
        .login-card {
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(40px) saturate(150%);
            -webkit-backdrop-filter: blur(40px) saturate(150%);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px;
            padding: 44px 36px;
            box-shadow:
                0 25px 70px rgba(0,0,0,0.4),
                0 0 0 1px rgba(255,255,255,0.05) inset,
                0 1px 0 rgba(255,255,255,0.1) inset;
            position: relative;
            overflow: hidden;
        }
        .login-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, #7c3aed, #06b6d4, #f472b6, #7c3aed);
            background-size: 300% 100%;
            animation: shimmer 4s ease infinite;
        }
        @keyframes shimmer {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ── Logo ── */
        .logo { text-align: center; margin-bottom: 36px; }
        .logo-icon {
            width: 64px; height: 64px;
            border-radius: 18px;
            background: linear-gradient(135deg, #7c3aed, #06b6d4);
            display: flex; align-items: center; justify-content: center;
            font-size: 32px;
            margin: 0 auto 16px;
            box-shadow: 0 8px 32px rgba(124, 58, 237, 0.3);
            animation: pulse-glow 3s ease-in-out infinite;
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 8px 32px rgba(124, 58, 237, 0.3); }
            50% { box-shadow: 0 8px 48px rgba(124, 58, 237, 0.5), 0 0 20px rgba(6, 182, 212, 0.2); }
        }
        .logo h1 {
            font-size: 30px; font-weight: 800;
            background: linear-gradient(135deg, #c084fc, #22d3ee, #f9a8d4);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }
        .logo p {
            color: rgba(255,255,255,0.45);
            font-size: 13px; margin-top: 6px;
            font-weight: 400; letter-spacing: 0.5px;
        }

        /* ── Form ── */
        .form-group { margin-bottom: 22px; position: relative; }
        .form-group label {
            display: block; font-size: 12px; font-weight: 600;
            color: rgba(255,255,255,0.6);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .input-wrapper {
            position: relative;
        }
        .input-wrapper .input-icon {
            position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
            font-size: 16px; opacity: 0.4;
            transition: opacity 0.3s;
        }
        .form-group input {
            width: 100%; padding: 15px 16px 15px 46px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px; color: #fff; font-size: 15px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .form-group input:focus {
            outline: none;
            border-color: rgba(124, 58, 237, 0.6);
            background: rgba(255,255,255,0.08);
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.1), 0 0 20px rgba(124, 58, 237, 0.05);
        }
        .form-group input:focus ~ .input-icon,
        .form-group input:not(:placeholder-shown) ~ .input-icon {
            opacity: 0.8;
        }
        .form-group input::placeholder { color: rgba(255,255,255,0.25); }

        /* Password toggle */
        .password-toggle {
            position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: rgba(255,255,255,0.4);
            cursor: pointer; font-size: 16px; padding: 4px;
            transition: color 0.3s;
        }
        .password-toggle:hover { color: rgba(255,255,255,0.8); }

        /* ── Forgot password link ── */
        .forgot-row {
            display: flex; justify-content: flex-end; margin-bottom: 8px; margin-top: -10px;
        }
        .forgot-link {
            font-size: 13px; color: #a78bfa;
            text-decoration: none; font-weight: 500;
            transition: color 0.3s;
            cursor: pointer;
            background: none; border: none;
            font-family: 'Inter', sans-serif;
        }
        .forgot-link:hover { color: #c4b5fd; }

        /* ── Button ── */
        .btn-login {
            width: 100%; padding: 16px;
            background: linear-gradient(135deg, #7c3aed, #2563eb);
            border: none; border-radius: 14px;
            color: #fff; font-size: 16px; font-weight: 700;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 12px;
            position: relative; overflow: hidden;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.3px;
        }
        .btn-login::before {
            content: '';
            position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transition: left 0.5s;
        }
        .btn-login:hover::before { left: 100%; }
        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(124, 58, 237, 0.45);
        }
        .btn-login:active { transform: translateY(-1px); }
        .btn-login:disabled {
            opacity: 0.5; cursor: not-allowed; transform: none !important;
            box-shadow: none !important;
        }

        /* ── Divider ── */
        .divider {
            display: flex; align-items: center; margin: 28px 0;
            gap: 16px;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1; height: 1px;
            background: rgba(255,255,255,0.08);
        }
        .divider span {
            font-size: 12px; color: rgba(255,255,255,0.3);
            text-transform: uppercase; letter-spacing: 1px;
            font-weight: 500;
        }

        /* ── Messages ── */
        .error-msg, .success-msg {
            padding: 12px 16px; border-radius: 12px;
            font-size: 13px; margin-bottom: 18px; display: none;
            animation: msgSlide 0.3s ease;
        }
        @keyframes msgSlide {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .error-msg {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #fca5a5;
        }
        .success-msg {
            background: rgba(34, 197, 94, 0.12);
            border: 1px solid rgba(34, 197, 94, 0.25);
            color: #86efac;
        }

        /* ── Register Link ── */
        .register-link {
            text-align: center; margin-top: 28px;
            font-size: 14px; color: rgba(255,255,255,0.45);
        }
        .register-link a {
            color: #a78bfa; text-decoration: none; font-weight: 600;
            transition: color 0.3s;
        }
        .register-link a:hover { color: #c4b5fd; text-decoration: underline; }

        /* ── Modal Overlay ── */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: none;
            align-items: center; justify-content: center;
            animation: fadeIn 0.3s ease;
        }
        .modal-overlay.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .modal {
            background: rgba(20, 20, 40, 0.95);
            backdrop-filter: blur(40px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 40px 36px;
            width: 100%; max-width: 420px;
            margin: 20px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.5);
            animation: modalSlide 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }
        @keyframes modalSlide {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .modal-close {
            position: absolute; top: 16px; right: 16px;
            background: rgba(255,255,255,0.08); border: none;
            color: rgba(255,255,255,0.6); width: 36px; height: 36px;
            border-radius: 10px; cursor: pointer; font-size: 18px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s;
        }
        .modal-close:hover { background: rgba(255,255,255,0.15); color: #fff; }
        .modal h2 {
            font-size: 22px; font-weight: 700; margin-bottom: 8px;
            background: linear-gradient(135deg, #c084fc, #22d3ee);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .modal p.subtitle {
            color: rgba(255,255,255,0.5); font-size: 14px; margin-bottom: 28px;
            line-height: 1.5;
        }
        .modal .form-group input {
            padding-left: 16px;
        }

        /* ── OTP Input ── */
        .otp-container {
            display: flex; gap: 10px; justify-content: center; margin-bottom: 24px;
        }
        .otp-input {
            width: 52px; height: 58px;
            text-align: center; font-size: 22px; font-weight: 700;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px; color: #fff;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s;
        }
        .otp-input:focus {
            outline: none;
            border-color: rgba(124, 58, 237, 0.6);
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.1);
            background: rgba(255,255,255,0.1);
        }

        .resend-timer {
            text-align: center; margin-top: 16px;
            font-size: 13px; color: rgba(255,255,255,0.4);
        }
        .resend-btn {
            background: none; border: none; color: #a78bfa;
            cursor: pointer; font-weight: 600;
            font-family: 'Inter', sans-serif; font-size: 13px;
        }
        .resend-btn:disabled { color: rgba(255,255,255,0.3); cursor: not-allowed; }

        /* ── Step indicators ── */
        .steps { display: flex; align-items: center; justify-content: center; margin-bottom: 28px; gap: 8px; }
        .step-dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: rgba(255,255,255,0.15);
            transition: all 0.3s;
        }
        .step-dot.active { background: #7c3aed; box-shadow: 0 0 12px rgba(124, 58, 237, 0.5); }
        .step-dot.done { background: #22c55e; }
        .step-line { width: 40px; height: 2px; background: rgba(255,255,255,0.1); }

        /* ── Hidden ── */
        .hidden { display: none !important; }

        /* ── Password strength ── */
        .password-strength { margin-top: 8px; }
        .strength-bar {
            height: 4px; border-radius: 2px;
            background: rgba(255,255,255,0.08);
            overflow: hidden;
        }
        .strength-fill {
            height: 100%; border-radius: 2px;
            transition: width 0.4s, background 0.4s;
            width: 0%;
        }
        .strength-text {
            font-size: 11px; margin-top: 4px;
            font-weight: 500; letter-spacing: 0.5px;
        }

        /* ── Responsive ── */
        @media (max-width: 480px) {
            .login-card { padding: 32px 24px; border-radius: 20px; }
            .logo h1 { font-size: 26px; }
            .modal { padding: 32px 24px; }
            .otp-input { width: 44px; height: 50px; font-size: 18px; }
        }
    </style>
</head>
<body>
    <!-- Aurora Background -->
    <div class="aurora"></div>

    <!-- Floating Particles -->
    <div class="particles" id="particles"></div>

    <!-- Main Login Form -->
    <div class="login-container">
        <div class="login-card">
            <div class="logo">
                <div class="logo-icon">🎓</div>
                <h1>EduHub</h1>
                <p>Smart College Management System</p>
            </div>

            <div class="error-msg" id="errorMsg"></div>
            <div class="success-msg" id="successMsg"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label>Username</label>
                    <div class="input-wrapper">
                        <input type="text" id="username" placeholder="Enter your username" required>
                        <span class="input-icon">👤</span>
                    </div>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" placeholder="Enter your password" required>
                        <span class="input-icon">🔒</span>
                        <button type="button" class="password-toggle" id="togglePassword" aria-label="Toggle password visibility">👁️</button>
                    </div>
                </div>

                <div class="forgot-row">
                    <button type="button" class="forgot-link" id="forgotBtn">Forgot password?</button>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">Sign In</button>
            </form>

            <div class="register-link">
                Don't have an account? <a href="register.html">Create Account</a>
            </div>
        </div>
    </div>

    <!-- ════════════════════════════════════════════
         FORGOT PASSWORD MODAL
         ════════════════════════════════════════════ -->
    <div class="modal-overlay" id="forgotModal">
        <div class="modal">
            <button class="modal-close" id="closeForgot">✕</button>

            <!-- Step indicators -->
            <div class="steps">
                <div class="step-dot active" id="stepDot1"></div>
                <div class="step-line"></div>
                <div class="step-dot" id="stepDot2"></div>
                <div class="step-line"></div>
                <div class="step-dot" id="stepDot3"></div>
            </div>

            <!-- STEP 1: Email input -->
            <div id="forgotStep1">
                <h2>Reset Password</h2>
                <p class="subtitle">Enter your registered email and we'll send you a verification code.</p>
                <div class="error-msg" id="forgotError1"></div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="forgotEmail" placeholder="you@example.com" required>
                </div>
                <button class="btn-login" id="sendOtpBtn" style="margin-top:4px;">Send Verification Code</button>
            </div>

            <!-- STEP 2: OTP verification -->
            <div id="forgotStep2" class="hidden">
                <h2>Verify Code</h2>
                <p class="subtitle">We've sent a 6-digit code to <strong id="emailDisplay"></strong></p>
                <div class="error-msg" id="forgotError2"></div>
                <div class="otp-container">
                    <input type="text" class="otp-input" maxlength="1" data-index="0">
                    <input type="text" class="otp-input" maxlength="1" data-index="1">
                    <input type="text" class="otp-input" maxlength="1" data-index="2">
                    <input type="text" class="otp-input" maxlength="1" data-index="3">
                    <input type="text" class="otp-input" maxlength="1" data-index="4">
                    <input type="text" class="otp-input" maxlength="1" data-index="5">
                </div>
                <button class="btn-login" id="verifyOtpBtn">Verify Code</button>
                <div class="resend-timer" id="resendArea">
                    <span id="timerText">Resend code in <strong id="countdown">60</strong>s</span>
                    <button class="resend-btn hidden" id="resendBtn">Resend Code</button>
                </div>
            </div>

            <!-- STEP 3: New password -->
            <div id="forgotStep3" class="hidden">
                <h2>New Password</h2>
                <p class="subtitle">Choose a strong password for your account.</p>
                <div class="error-msg" id="forgotError3"></div>
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="newPassword" placeholder="Minimum 6 characters" required>
                    <div class="password-strength">
                        <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
                        <div class="strength-text" id="strengthText"></div>
                    </div>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Re-enter password" required>
                </div>
                <button class="btn-login" id="resetPasswordBtn">Reset Password</button>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        // ── Floating Particles Generator ──
        (function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const size = Math.random() * 6 + 2;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = (Math.random() * 15 + 10) + 's';
                p.style.animationDelay = (Math.random() * 10) + 's';
                container.appendChild(p);
            }
        })();

        // ── Password Toggle ──
        document.getElementById('togglePassword').addEventListener('click', () => {
            const pwd = document.getElementById('password');
            const btn = document.getElementById('togglePassword');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                btn.textContent = '🙈';
            } else {
                pwd.type = 'password';
                btn.textContent = '👁️';
            }
        });

        // ── Login Form ──
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            btn.disabled = true;
            btn.textContent = 'Signing in...';

            try {
                const res = await fetch(`${API_BASE}/api/login/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value
                    })
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.error || 'Invalid credentials');
                }

                // Store auth data
                localStorage.setItem('access_token', data.tokens.access);
                localStorage.setItem('refresh_token', data.tokens.refresh);
                localStorage.setItem('user', JSON.stringify(data.user));

                successMsg.textContent = '✓ Login successful! Redirecting...';
                successMsg.style.display = 'block';

                // Redirect based on role
                setTimeout(() => {
                    const role = data.user.role;
                    if (role === 'faculty' || role === 'admin') {
                        window.location.href = 'teacher.html';
                    } else {
                        window.location.href = 'student.html';
                    }
                }, 800);
            } catch (err) {
                errorMsg.textContent = err.message;
                errorMsg.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        });

        // Redirect if already logged in
        if (localStorage.getItem('access_token')) {
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            if (user.role === 'faculty' || user.role === 'admin') {
                window.location.href = 'teacher.html';
            } else if (user.role === 'student') {
                window.location.href = 'student.html';
            }
        }

        // ══════════════════════════════════════
        // FORGOT PASSWORD FLOW
        // ══════════════════════════════════════
        let forgotEmail = '';
        let countdownTimer = null;

        const forgotModal   = document.getElementById('forgotModal');
        const step1         = document.getElementById('forgotStep1');
        const step2         = document.getElementById('forgotStep2');
        const step3         = document.getElementById('forgotStep3');
        const stepDots      = [document.getElementById('stepDot1'), document.getElementById('stepDot2'), document.getElementById('stepDot3')];

        function setStep(n) {
            [step1, step2, step3].forEach((s, i) => s.classList.toggle('hidden', i !== n));
            stepDots.forEach((d, i) => {
                d.classList.remove('active', 'done');
                if (i < n) d.classList.add('done');
                if (i === n) d.classList.add('active');
            });
        }

        // Open / close modal
        document.getElementById('forgotBtn').addEventListener('click', () => {
            forgotModal.classList.add('active');
            setStep(0);
        });
        document.getElementById('closeForgot').addEventListener('click', () => {
            forgotModal.classList.remove('active');
            if (countdownTimer) clearInterval(countdownTimer);
        });
        forgotModal.addEventListener('click', (e) => {
            if (e.target === forgotModal) {
                forgotModal.classList.remove('active');
                if (countdownTimer) clearInterval(countdownTimer);
            }
        });

        // STEP 1 → Send OTP
        document.getElementById('sendOtpBtn').addEventListener('click', async () => {
            const btn = document.getElementById('sendOtpBtn');
            const errDiv = document.getElementById('forgotError1');
            errDiv.style.display = 'none';
            forgotEmail = document.getElementById('forgotEmail').value.trim();

            if (!forgotEmail) {
                errDiv.textContent = 'Please enter your email address.';
                errDiv.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Sending...';

            try {
                const res = await fetch(`${API_BASE}/api/forgot-password/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: forgotEmail })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Failed to send code');

                document.getElementById('emailDisplay').textContent = forgotEmail;
                setStep(1);
                startCountdown();
            } catch (err) {
                errDiv.textContent = err.message;
                errDiv.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Send Verification Code';
            }
        });

        // OTP input auto-focus
        document.querySelectorAll('.otp-input').forEach((input, idx, arr) => {
            input.addEventListener('input', (e) => {
                const val = e.target.value;
                if (val && idx < arr.length - 1) arr[idx + 1].focus();
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && idx > 0) {
                    arr[idx - 1].focus();
                }
            });
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const paste = (e.clipboardData || window.clipboardData).getData('text').trim();
                if (paste.length === 6 && /^\d+$/.test(paste)) {
                    arr.forEach((inp, i) => { inp.value = paste[i] || ''; });
                    arr[5].focus();
                }
            });
        });

        // Countdown timer
        function startCountdown() {
            let seconds = 60;
            const countdownEl = document.getElementById('countdown');
            const timerText = document.getElementById('timerText');
            const resendBtn = document.getElementById('resendBtn');
            timerText.classList.remove('hidden');
            resendBtn.classList.add('hidden');
            countdownEl.textContent = seconds;

            if (countdownTimer) clearInterval(countdownTimer);
            countdownTimer = setInterval(() => {
                seconds--;
                countdownEl.textContent = seconds;
                if (seconds <= 0) {
                    clearInterval(countdownTimer);
                    timerText.classList.add('hidden');
                    resendBtn.classList.remove('hidden');
                }
            }, 1000);
        }

        // Resend OTP
        document.getElementById('resendBtn').addEventListener('click', async () => {
            const btn = document.getElementById('resendBtn');
            btn.disabled = true;
            btn.textContent = 'Sending...';
            try {
                await fetch(`${API_BASE}/api/forgot-password/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: forgotEmail })
                });
                startCountdown();
            } catch (err) {
                // silently fail
            } finally {
                btn.disabled = false;
                btn.textContent = 'Resend Code';
            }
        });

        // STEP 2 → Verify OTP
        document.getElementById('verifyOtpBtn').addEventListener('click', async () => {
            const btn = document.getElementById('verifyOtpBtn');
            const errDiv = document.getElementById('forgotError2');
            errDiv.style.display = 'none';

            const otp = Array.from(document.querySelectorAll('.otp-input')).map(i => i.value).join('');
            if (otp.length !== 6) {
                errDiv.textContent = 'Please enter the complete 6-digit code.';
                errDiv.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Verifying...';

            try {
                const res = await fetch(`${API_BASE}/api/verify-otp/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: forgotEmail, otp: otp })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Invalid code');

                setStep(2);
                if (countdownTimer) clearInterval(countdownTimer);
            } catch (err) {
                errDiv.textContent = err.message;
                errDiv.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Verify Code';
            }
        });

        // Password strength meter
        document.getElementById('newPassword').addEventListener('input', (e) => {
            const val = e.target.value;
            const fill = document.getElementById('strengthFill');
            const text = document.getElementById('strengthText');
            let score = 0;
            if (val.length >= 6) score++;
            if (val.length >= 10) score++;
            if (/[A-Z]/.test(val)) score++;
            if (/[0-9]/.test(val)) score++;
            if (/[^A-Za-z0-9]/.test(val)) score++;

            const levels = [
                { w: '0%', c: '#555', t: '' },
                { w: '20%', c: '#ef4444', t: 'Weak' },
                { w: '40%', c: '#f97316', t: 'Fair' },
                { w: '60%', c: '#eab308', t: 'Good' },
                { w: '80%', c: '#22c55e', t: 'Strong' },
                { w: '100%', c: '#06b6d4', t: 'Excellent' },
            ];
            const lvl = levels[score];
            fill.style.width = lvl.w;
            fill.style.background = lvl.c;
            text.textContent = lvl.t;
            text.style.color = lvl.c;
        });

        // STEP 3 → Reset Password
        document.getElementById('resetPasswordBtn').addEventListener('click', async () => {
            const btn = document.getElementById('resetPasswordBtn');
            const errDiv = document.getElementById('forgotError3');
            errDiv.style.display = 'none';

            const newPwd = document.getElementById('newPassword').value;
            const confirmPwd = document.getElementById('confirmPassword').value;

            if (newPwd.length < 6) {
                errDiv.textContent = 'Password must be at least 6 characters.';
                errDiv.style.display = 'block';
                return;
            }
            if (newPwd !== confirmPwd) {
                errDiv.textContent = 'Passwords do not match.';
                errDiv.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Resetting...';

            const otp = Array.from(document.querySelectorAll('.otp-input')).map(i => i.value).join('');

            try {
                const res = await fetch(`${API_BASE}/api/reset-password/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: forgotEmail,
                        otp: otp,
                        new_password: newPwd
                    })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Failed to reset password');

                forgotModal.classList.remove('active');
                const mainSuccess = document.getElementById('successMsg');
                mainSuccess.textContent = '✓ Password reset successful! You can now sign in.';
                mainSuccess.style.display = 'block';
            } catch (err) {
                errDiv.textContent = err.message;
                errDiv.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Reset Password';
            }
        });
    </script>
</body>
</html>
