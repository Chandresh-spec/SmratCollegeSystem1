services:
  - type: web
    name: SmratCollegeSystem
    runtime: python
    buildCommand: ./build.sh
    startCommand: cd Home && gunicorn Home.wsgi:application --bind 0.0.0.0:$PORT --workers 1
    envVars:
      - key: RENDER
        value: true
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
